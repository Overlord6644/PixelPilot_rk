gsmenu:
  enabled: true
  gpio:
    # RuncamVRX
    left: 13
    right: 38
    up: 16
    down: 18
    center: 11
    # alternative
    # center:
    #   chip: gpiochip3
    #   pin: 1
    rec: 32
    # Ruby
    # left: 13
    # right: 11
    # up: 16
    # down: 18
    # rec: 32
    # Bonnet
    # left: 13
    # right: 12
    # up: 16
    # down: 18
    # center: 11
    # rec: 22
    # Emax Wyvern Link Goggle VRX
    # left: 38
    # right: 32
    # up: 16
    # down: 18
    # Eachine Sphere Link VRX - the map form carries the extra keys below.
    # up:     { chip: gpiochip3, pin: 9 }
    # down:   { chip: gpiochip3, pin: 10 }
    # left:   { chip: gpiochip3, pin: 2, long_action: "" }   # no long-press record; there is a REC button
    # center: { chip: gpiochip3, pin: 1 }
    # rec:    { chip: gpiochip3, pin: 18 }
    # 5-way RIGHT is active-low with no external pull:
    # right:  { chip: gpiochip3, pin: 5, bias: pull-up, active_low: true }
    # dedicated AP button toggles the WiFi hotspot instead of duplicating Enter:
    # ap:     { chip: gpiochip3, pin: 6, action: "gsmenu.sh set gs wifi hotspot toggle" }
    #
    # Optional per-button keys (map form only), all backward compatible:
    #   active_low: true                   invert the line (idle 1, pressed 0)
    #   bias: pull-up|pull-down|disable    internal pull for a floating line
    #   action: "<cmd>"                    run a command on press instead of a key
    #   long_action: "<cmd>"               run a command on long press
    #                                      ("" = do nothing = disable the shortcut)
    # A button named "ap" is a 7th, action-only slot for a dedicated button.
  # Define custom actions here
  # action is the command the button will trigger
  # actions:
  #   air:
  #     - label: Custom Action 1
  #       action: sleep 5
  #     - label: Custom Action 1
  #       action: sleep 5
  #   ground:
  #     - label: Custom Action 1
  #       action: sleep 5
# enables collection of `os_mon.*` OSD facts
os_sensors:
  cpu: true      # Monitor CPU load percentage
  power:
    # Monitor power supply voltage and current (advanced: requires INA226 sensor to be installed)
    # It can be several, but normally you just install one to monitor battery
    - type: ina226  # currently the only type supported
      hwmon_id: hwmon3  # /sys/class/hwmon/{hwmon_id}/name should be ina226
  temperature:
    # Monitor Radxa chip temperatures, see /sys/class/thermal/thermal_zone*/
    - thermal_zone: thermal_zone0  # CPU on Radxa
    - thermal_zone: thermal_zone1  # GPU on Radxa

# OS sensors can be auto-discovered
# os_sensors:
#   cpu: auto
#   power: auto
#   temperature: auto

# Phone restream target IP (optional)
# manual_ip: permanently pins this IP in the "Stream To" dropdown so it is
#   always visible as an option, even when auto-discovery finds no clients.
# restream:
#   manual_ip: 192.168.1.100
